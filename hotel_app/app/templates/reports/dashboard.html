<!doctype html>
<title>Reports Dashboard</title>
<h1>Reports Dashboard</h1>
<div>
  <form method="get" action="">
    <label>Start: <input type="date" name="start" value="{{ start }}"></label>
    <label>End: <input type="date" name="end" value="{{ end }}"></label>
    <button type="submit">Apply</button>
  </form>
</div>
<div class="cards">
  <div>Occupancy: {{ '%.2f'|format(occupancy) }}%</div>
  <div>Revenue: ${{ revenue }}</div>
  <div>RevPAR: ${{ '%.2f'|format(revpar) }}</div>
  <div>Avg Stay: {{ '%.2f'|format(avg_length) }} nights</div>
</div>
<canvas id="revChart" width="400" height="150"></canvas>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const ctx = document.getElementById('revChart');
const chart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: {{ days|tojson }},
    datasets: [{
      label: 'Daily Revenue',
      data: {{ daily_revenue|tojson }},
      borderColor: 'blue',
      fill: false
    }]
  },
});
</script>
