<!doctype html>
<title>Today's Tasks</title>
<h1>Today's Tasks</h1>
<table>
  <thead>
    <tr><th>Room</th><th>Status</th><th>Notes</th><th></th></tr>
  </thead>
  <tbody>
    {% for task in tasks %}
    <tr>
      <td>{{ task.room.room_number }}</td>
      <td>{{ task.status.value }}</td>
      <td>{{ task.notes or '' }}</td>
      <td>
        {% if task.status != status_enum.DONE %}
        <form method="post" action="{{ url_for('housekeeping.complete_task', task_id=task.id) }}">
          <button type="submit">Complete</button>
        </form>
        {% endif %}
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
